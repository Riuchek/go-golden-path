name: Deploy GKE workload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - service/**
      - otel/**
      - terraform/modules/gke-workload/**
      - terraform/modules/monitoring/**
      - terraform/modules/project-services/**
      - terraform/stacks/gke-workload/**
      - .github/workflows/deploy-gke.yml

concurrency:
  group: deploy-gke
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build and apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Image reference
        id: image
        run: echo "name=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/services/checkout:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The cluster stack is applied by hand. This workflow only rolls the workload.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Terraform apply
        working-directory: terraform/stacks/gke-workload
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_cluster_name: ${{ vars.GCP_GKE_CLUSTER }}
          TF_VAR_image: ${{ steps.image.outputs.name }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=stacks/gke-workload"
          terraform apply -input=false -auto-approve
