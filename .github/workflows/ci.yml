name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.9"
      - name: fmt
        run: tofu fmt -check -recursive tofu
      - name: validate
        run: |
          set -euo pipefail
          for stack in bootstrap local aws; do
            echo "==> ${stack}"
            tofu -chdir="tofu/stacks/${stack}" init -backend=false -input=false
            tofu -chdir="tofu/stacks/${stack}" validate
          done
