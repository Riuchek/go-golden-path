name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: validate
        run: |
          set -euo pipefail
          for stack in bootstrap cloud-run gke-cluster gke-workload; do
            echo "==> ${stack}"
            terraform -chdir="terraform/stacks/${stack}" init -backend=false -input=false
            terraform -chdir="terraform/stacks/${stack}" validate
          done
