name: Deploy AWS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - service/**
      - otel/**
      - tofu/modules/**
      - tofu/stacks/aws/**
      - .github/workflows/deploy-aws.yml

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build and apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image reference
        id: image
        run: echo "name=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: service
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.9"

      - name: OpenTofu apply
        working-directory: tofu/stacks/aws
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_image: ${{ steps.image.outputs.name }}
          TF_VAR_create_registry: "false"
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=stacks/aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          tofu apply -input=false -auto-approve
