name: Deploy AWS

# Manual only until bootstrap has created the OIDC role and Actions variables.
# Auto-deploy on push would fail red on every commit in a portfolio clone.
on:
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build and apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Actions variables
        run: |
          set -euo pipefail
          missing=0
          for v in AWS_DEPLOY_ROLE_ARN AWS_REGION TF_STATE_BUCKET ECR_REPOSITORY; do
            if [ -z "${!v:-}" ]; then
              echo "missing repository variable: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the variables from tofu/stacks/bootstrap outputs, then re-run."
            exit 1
          fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image reference
        id: image
        run: echo "name=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.9"

      - name: OpenTofu apply
        working-directory: tofu/stacks/aws
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_image: ${{ steps.image.outputs.name }}
          TF_VAR_create_registry: "false"
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=stacks/aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          tofu apply -input=false -auto-approve
